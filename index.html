<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שבתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213d;
    --paper: #f7f8fb;
    --card: #ffffff;
    --line: #d9deea;
    --gold: #b8892b;
    --muted: #5b6477;
    --error: #a12b2b;
    --ok: #1f6b45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Assistant", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
  }
  header {
    background: var(--ink);
    color: #fff;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid var(--gold);
  }
  header h1 {
    margin: 0;
    font-family: "Frank Ruhl Libre", serif;
    font-size: 1.9rem;
    font-weight: 700;
  }
  main { max-width: 460px; margin: 40px auto; padding: 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px;
  }
  h2 { font-family: "Frank Ruhl Libre", serif; margin: 0 0 18px; font-size: 1.6rem; }
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .tabs button {
    flex: 1; padding: 10px; font: inherit; font-weight: 600;
    background: transparent; color: var(--muted);
    border: 0; border-bottom: 3px solid var(--line); cursor: pointer;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  input, textarea {
    width: 100%; padding: 10px 12px; font: inherit;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
  }
  textarea { min-height: 90px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid var(--gold); outline-offset: 2px;
  }
  .primary {
    width: 100%; margin-top: 22px; padding: 12px; font: inherit; font-weight: 600;
    background: var(--ink); color: #fff; border: 0; border-radius: 6px; cursor: pointer;
  }
  .primary:disabled { opacity: .6; cursor: wait; }
  .link {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5);
    padding: 6px 14px; border-radius: 6px; font: inherit; cursor: pointer;
  }
  .msg { margin-top: 16px; min-height: 1.4em; font-weight: 600; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }
  .email { color: var(--muted); margin: -10px 0 8px; direction: ltr; text-align: right; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1 id="siteName">שבתי</h1>
  <button id="logoutBtn" class="link" hidden>התנתקות</button>
</header>

<main>
  <!-- התחברות והרשמה -->
  <section id="authView" class="card" hidden>
    <div class="tabs" role="tablist">
      <button id="tabLogin" role="tab" aria-selected="true">התחברות</button>
      <button id="tabSignup" role="tab" aria-selected="false">הרשמה</button>
    </div>
    <form id="authForm">
      <div id="nameRow" hidden>
        <label for="fullName">שם מלא</label>
        <input id="fullName" autocomplete="name">
      </div>
      <label for="email">אימייל</label>
      <input id="email" type="email" required autocomplete="email" dir="ltr">
      <label for="password">סיסמה</label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password" dir="ltr">
      <button id="authSubmit" class="primary" type="submit">התחברות</button>
    </form>
    <p id="authMsg" class="msg" role="status"></p>
  </section>

  <!-- האיזור האישי -->
  <section id="accountView" class="card" hidden>
    <h2 id="hello">האיזור האישי שלי</h2>
    <p id="accountEmail" class="email"></p>
    <form id="profileForm">
      <label for="pName">שם מלא</label>
      <input id="pName">
      <label for="pBio">קצת עליי</label>
      <textarea id="pBio"></textarea>
      <button id="saveBtn" class="primary" type="submit">שמירת שינויים</button>
    </form>
    <p id="profileMsg" class="msg" role="status"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://goxuttqosikycbskqhra.supabase.co";
  const SUPABASE_KEY = "sb_publishable__yAh-tm8u3VWggJGKRR-6Q_hvquy945";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);
  let mode = "login";

  function setMode(next) {
    mode = next;
    const signup = mode === "signup";
    $("tabLogin").setAttribute("aria-selected", String(!signup));
    $("tabSignup").setAttribute("aria-selected", String(signup));
    $("nameRow").hidden = !signup;
    $("authSubmit").textContent = signup ? "יצירת חשבון" : "התחברות";
    $("password").autocomplete = signup ? "new-password" : "current-password";
    $("authMsg").textContent = "";
  }
  $("tabLogin").onclick = () => setMode("login");
  $("tabSignup").onclick = () => setMode("signup");

  function say(el, text, kind) {
    el.textContent = text;
    el.className = "msg " + (kind || "");
  }

  function hebrewError(err) {
    const m = (err && err.message || "").toLowerCase();
    if (m.includes("invalid login")) return "האימייל או הסיסמה שגויים.";
    if (m.includes("already registered")) return "כבר קיים חשבון עם האימייל הזה. אפשר להתחבר.";
    if (m.includes("email not confirmed")) return "צריך לאשר את האימייל. בדקי את תיבת הדואר שלך.";
    if (m.includes("password")) return "הסיסמה חייבת להכיל לפחות 6 תווים.";
    return "משהו השתבש. נסי שוב בעוד רגע.";
  }

  $("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("authSubmit");
    btn.disabled = true;
    say($("authMsg"), "");
    const email = $("email").value.trim();
    const password = $("password").value;
    try {
      if (mode === "signup") {
        const { data, error } = await db.auth.signUp({
          email, password,
          options: { data: { full_name: $("fullName").value.trim() } }
        });
        if (error) throw error;
        if (!data.session) {
          say($("authMsg"), "החשבון נוצר. שלחנו אליך מייל לאישור, ואחרי האישור אפשר להתחבר.", "ok");
        }
      } else {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (err) {
      say($("authMsg"), hebrewError(err), "error");
    } finally {
      btn.disabled = false;
    }
  });

  async function showAccount(user) {
    $("authView").hidden = true;
    $("accountView").hidden = false;
    $("logoutBtn").hidden = false;
    $("accountEmail").textContent = user.email;
    const { data, error } = await db.from("profiles").select("full_name, bio").eq("id", user.id).maybeSingle();
    if (error) { say($("profileMsg"), "לא הצלחנו לטעון את הפרופיל.", "error"); return; }
    $("pName").value = (data && data.full_name) || "";
    $("pBio").value = (data && data.bio) || "";
    $("hello").textContent = data && data.full_name ? "שלום, " + data.full_name : "האיזור האישי שלי";
  }

  function showAuth() {
    $("accountView").hidden = true;
    $("logoutBtn").hidden = true;
    $("authView").hidden = false;
    $("authForm").reset();
    setMode("login");
  }

  $("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("saveBtn");
    btn.disabled = true;
    const { data: { user } } = await db.auth.getUser();
    const { error } = await db.from("profiles")
      .update({ full_name: $("pName").value.trim(), bio: $("pBio").value.trim() })
      .eq("id", user.id);
    btn.disabled = false;
    if (error) { say($("profileMsg"), "השמירה נכשלה. נסי שוב.", "error"); return; }
    say($("profileMsg"), "השינויים נשמרו.", "ok");
    $("hello").textContent = $("pName").value.trim() ? "שלום, " + $("pName").value.trim() : "האיזור האישי שלי";
  });

  $("logoutBtn").onclick = () => db.auth.signOut();

  db.auth.onAuthStateChange((_event, session) => {
    if (session && session.user) showAccount(session.user);
    else showAuth();
  });
</script>
</body>
</html>
