<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שבתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#14213d; --paper:#f7f8fb; --card:#fff; --line:#d9deea; --gold:#b8892b; --muted:#5b6477; --error:#a12b2b; --ok:#1f6b45; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family:"Assistant",system-ui,sans-serif; background:var(--paper); color:var(--ink); line-height:1.6; min-height:100vh; }
  header { background:var(--ink); color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; border-bottom:4px solid var(--gold); }
  header h1 { margin:0; font-family:"Frank Ruhl Libre",serif; font-size:1.9rem; font-weight:700; }
  nav { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  nav button { background:transparent; color:#fff; border:0; border-bottom:3px solid transparent; padding:6px 10px; font:inherit; cursor:pointer; }
  nav button[aria-current="true"] { border-bottom-color:var(--gold); }
  nav .out { border:1px solid rgba(255,255,255,.5); border-radius:6px; margin-inline-start:8px; }
  main { max-width:760px; margin:32px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:28px; }
  .narrow { max-width:460px; margin-inline:auto; }
  h2 { font-family:"Frank Ruhl Libre",serif; margin:0 0 14px; font-size:1.7rem; }
  h3 { font-family:"Frank Ruhl Libre",serif; margin:0 0 4px; font-size:1.3rem; }
  .tabs { display:flex; gap:8px; margin-bottom:22px; }
  .tabs button { flex:1; padding:10px; font:inherit; font-weight:600; background:transparent; color:var(--muted); border:0; border-bottom:3px solid var(--line); cursor:pointer; }
  .tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--gold); }
  label { display:block; font-weight:600; margin:14px 0 4px; }
  input, textarea, select { width:100%; padding:10px 12px; font:inherit; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  textarea { min-height:90px; resize:vertical; }
  #iBody { min-height:200px; }
  :focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .primary { width:100%; margin-top:22px; padding:12px; font:inherit; font-weight:600; background:var(--ink); color:#fff; border:0; border-radius:6px; cursor:pointer; }
  .primary:disabled { opacity:.6; cursor:wait; }
  .btn { display:inline-block; padding:8px 16px; background:var(--ink); color:#fff; border-radius:6px; text-decoration:none; }
  .back { background:transparent; border:0; color:var(--muted); font:inherit; cursor:pointer; padding:0; margin-bottom:14px; }
  .msg { margin-top:16px; min-height:1.4em; font-weight:600; }
  .msg.error { color:var(--error); } .msg.ok { color:var(--ok); }
  .muted, .meta { color:var(--muted); }
  .email { color:var(--muted); margin:-6px 0 8px; direction:ltr; text-align:right; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .chips button { border:1px solid var(--line); background:#fff; padding:6px 16px; border-radius:999px; font:inherit; cursor:pointer; color:var(--ink); }
  .chips button[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  .item { display:block; width:100%; text-align:right; background:var(--card); border:1px solid var(--line); border-inline-start:4px solid var(--gold); border-radius:8px; padding:16px 18px; margin-bottom:12px; cursor:pointer; font:inherit; color:inherit; }
  .item p { margin:6px 0 0; }
  .kind { color:var(--gold); font-weight:600; font-size:.95rem; }
  .body { font-size:1.1rem; line-height:1.9; max-width:62ch; }
  .media { margin:18px 0; }
  .media iframe { width:100%; aspect-ratio:16/9; border:0; border-radius:8px; }
  .media audio, .media video { width:100%; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .del { background:transparent; border:1px solid var(--error); color:var(--error); border-radius:6px; padding:4px 12px; font:inherit; cursor:pointer; }
  .fav { margin:12px 0 4px; padding:6px 16px; border:1px solid var(--gold); background:#fff; color:var(--ink); border-radius:999px; font:inherit; cursor:pointer; }
  .fav[aria-pressed="true"] { background:var(--gold); color:#fff; }
  .sec { margin:28px 0 12px; font-size:1.4rem; }
  .check { display:flex; gap:10px; align-items:center; font-weight:600; margin:0 0 6px; }
  .check input { width:auto; }
  .sub { font-size:1.1rem; margin:22px 0 8px; }
  .inline { display:flex; gap:8px; }
  .small { border:1px solid var(--ink); background:#fff; color:var(--ink); border-radius:6px; padding:4px 14px; font:inherit; cursor:pointer; white-space:nowrap; }
  .favrow { margin-bottom:18px; }
  .favrow .item { margin-bottom:4px; }
  .favrow .check { margin:2px 4px 0; font-weight:400; }
  .hero { display:block; max-width:220px; width:60%; margin:0 auto 20px; border-radius:8px; }
  .crumbs { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0; }
  .note { border:1px solid var(--line); border-inline-start:4px solid var(--gold); border-radius:8px; padding:12px 14px; margin:10px 0; }
  .note blockquote { margin:0 0 6px; color:var(--muted); font-style:italic; }
  .note p { margin:0 0 6px; white-space:pre-wrap; }
  .nform > * { margin-top:8px; }
  .nform .primary { width:auto; padding:8px 22px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<header>
  <h1>שבתי</h1>
  <nav id="nav" hidden>
    <button data-view="libraryView" id="navLib">ספרייה</button>
    <button data-view="accountView" id="navAcc">האיזור שלי</button>
    <button data-view="adminView" id="navAdmin" hidden>ניהול</button>
    <button id="logoutBtn" class="out">התנתקות</button>
  </nav>
</header>

<main>
  <section id="authView" class="card narrow" hidden>
    <img class="hero" src="rebbe.jpg" alt="" onerror="this.remove()">
    <div class="tabs" role="tablist">
      <button id="tabLogin" role="tab" aria-selected="true">התחברות</button>
      <button id="tabSignup" role="tab" aria-selected="false">הרשמה</button>
    </div>
    <form id="authForm">
      <div id="nameRow" hidden>
        <label for="fullName">שם מלא</label>
        <input id="fullName" autocomplete="name">
      </div>
      <label for="email">אימייל</label>
      <input id="email" type="email" required autocomplete="email" dir="ltr">
      <label for="password">סיסמה</label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password" dir="ltr">
      <button id="authSubmit" class="primary" type="submit">התחברות</button>
    </form>
    <p id="authMsg" class="msg" role="status"></p>
  </section>

  <section id="libraryView" hidden>
    <h2>ספרייה</h2>
    <form id="searchForm" class="inline">
      <input id="q" placeholder="חיפוש בכותרות, מחברים, תקצירים וטקסט" aria-label="חיפוש">
      <button class="small" type="submit">חיפוש</button>
    </form>
    <p class="meta">חלוקה לפי תאריך:
      <select id="cal" style="width:auto"><option value="heb">עברי</option><option value="greg">לועזי</option></select>
    </p>
    <p><button class="small" id="newBtn" type="button">התכנים החדשים ביותר</button></p>
    <div class="crumbs" id="crumbs"></div>
    <div id="itemsList"></div>
  </section>

  <section id="itemView" class="card" hidden>
    <button class="back" id="backBtn">חזרה לספרייה</button>
    <div id="itemBox"></div>
  </section>

  <section id="accountView" hidden>
    <div class="card">
    <h2 id="hello">האיזור האישי שלי</h2>
    <p id="accountEmail" class="email"></p>
    <form id="profileForm">
      <label for="pName">שם מלא</label>
      <input id="pName">
      <label for="pBio">קצת עליי</label>
      <textarea id="pBio"></textarea>
      <button id="saveBtn" class="primary" type="submit">שמירת שינויים</button>
    </form>
    <p id="profileMsg" class="msg" role="status"></p>
    </div>
    <h2 class="sec">המשך מהמקום שעצרתי</h2>
    <div id="recentList"></div>
    <h2 class="sec">המועדפים שלי</h2>
    <div id="favList"></div>
    <p id="favMsg" class="msg" role="status"></p>

    <h2 class="sec">שיתוף עם אחרים</h2>
    <div class="card">
      <p class="muted">רק מה שסימנת לשיתוף (תכנים במועדפים והערות) יהיה גלוי לאחרים.</p>
      <label class="check"><input type="checkbox" id="pubToggle"> שיתוף עם כל המשתמשים באתר</label>
      <h3 class="sub">שיתוף עם משתמשים מסוימים</h3>
      <form id="userSearchForm" class="inline">
        <input id="userQ" placeholder="חיפוש לפי שם" aria-label="חיפוש משתמש לפי שם">
        <button class="small" type="submit">חיפוש</button>
      </form>
      <div id="userResults"></div>
      <h3 class="sub">משותף כרגע עם</h3>
      <div id="sharedWith"></div>
      <p id="shareMsg" class="msg" role="status"></p>
    </div>

    <h2 class="sec">שיתפו איתי</h2>
    <div class="card"><div id="sharedToMe"></div></div>
  </section>

  <section id="sharedView" hidden>
    <button class="back" id="backAcc">חזרה לאיזור האישי</button>
    <h2 id="sharedTitle"></h2>
    <div id="sharedItems"></div>
  </section>

  <section id="adminView" class="card" hidden>
    <h2>הוספת תוכן</h2>
    <form id="itemForm">
      <label for="iCat">קטגוריה</label>
      <select id="iCat"></select>
      <label for="iRebbe">רבי</label>
      <select id="iRebbe"></select>
      <label for="hY">תאריך התוכן (עברי)</label>
      <div class="inline">
        <select id="hY" aria-label="שנה עברית"></select>
        <select id="hM" aria-label="חודש עברי"></select>
        <select id="hD" aria-label="יום עברי"></select>
      </div>
      <label for="iDate">או תאריך לועזי</label>
      <input id="iDate" type="date">
      <label for="iTitle">כותרת</label>
      <input id="iTitle" required>
      <label for="iAuthor">מחבר או מגיד השיעור</label>
      <input id="iAuthor">
      <label for="iSummary">תקציר קצר</label>
      <input id="iSummary">
      <label for="iFile">קובץ במראה המקורי (PDF או תמונה)</label>
      <input id="iFile" type="file" accept=".pdf,image/*">
      <label for="iMedia">קישור לשמע או לוידאו (https://)</label>
      <input id="iMedia" dir="ltr">
      <label for="iBody">טקסט (פסקאות מופרדות בשורה ריקה)</label>
      <textarea id="iBody"></textarea>
      <button id="itemSave" class="primary" type="submit">פרסום</button>
    </form>
    <p id="itemMsg" class="msg" role="status"></p>
    <h2 class="sec">קטגוריות</h2>
    <form id="catForm" class="inline"><input id="catName" placeholder="קטגוריה חדשה" aria-label="שם קטגוריה"><button class="small" type="submit">הוספה</button></form>
    <div id="catManage"></div>
    <h2 class="sec">רבנים</h2>
    <form id="rebbeForm" class="inline"><input id="rebbeName" placeholder="שם חדש" aria-label="שם רבי"><button class="small" type="submit">הוספה</button></form>
    <div id="rebbeManage"></div>
    <h2 class="sec">תכנים קיימים</h2>
    <div id="adminList"></div>
    <h2 class="sec">משתמשים</h2>
    <input id="userFilter" placeholder="סינון לפי שם או אימייל" aria-label="סינון משתמשים">
    <div id="userList"></div>
    <h2 class="sec">הערות משותפות אחרונות</h2>
    <div id="modNotes"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const db = supabase.createClient("https://goxuttqosikycbskqhra.supabase.co", "sb_publishable__yAh-tm8u3VWggJGKRR-6Q_hvquy945");
  const $ = (id) => document.getElementById(id);
  const VIEWS = ["authView","libraryView","itemView","accountView","adminView","sharedView"];
  const KINDS = { article: "מאמר", audio: "שיעור שמע", video: "שיעור וידאו" };
  let me = null, isAdmin = false, filter = "all", mode = "login", favs = new Set();
  let flashMsg = "", allUsers = [], all = [], path = [], showAll = false, cal = "heb", cats = {}, rebbeName = {}, catList = [], rebbeList = [];

  function h(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function say(el, text, kind) { el.textContent = text; el.className = "msg " + (kind || ""); }
  const SS = "shabtai_state";
  function loadState() { try { return JSON.parse(sessionStorage.getItem(SS) || "{}"); } catch (e) { return {}; } }
  function saveState(extra) { try { sessionStorage.setItem(SS, JSON.stringify({ ...loadState(), ...extra })); } catch (e) {} }
  let scrollTimer;
  window.addEventListener("scroll", () => { clearTimeout(scrollTimer); scrollTimer = setTimeout(() => saveState({ scroll: window.scrollY }), 150); }, { passive: true });
  window.addEventListener("beforeunload", () => saveState({ scroll: window.scrollY }));
  const hdf = new Intl.DateTimeFormat("he-u-ca-hebrew", { year: "numeric", month: "long", day: "numeric" });
  const hp = (d) => { const pp = hdf.formatToParts(d), g = (t) => (pp.find((x) => x.type === t) || {}).value; return { y: g("year"), m: g("month"), d: g("day") }; };
  const isoOf = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  function dual(v) {
    const d = new Date(String(v).length === 10 ? v + "T12:00:00" : v);
    return d.toLocaleDateString("he-IL") + " (" + hdf.format(d) + ")";
  }
  function show(v) {
    VIEWS.forEach((x) => { $(x).hidden = x !== v; });
    if (v !== "authView") saveState({ view: v, scroll: 0 });
    const hl = v === "itemView" ? "libraryView" : v === "sharedView" ? "accountView" : v;
    document.querySelectorAll("nav button[data-view]").forEach((b) =>
      b.setAttribute("aria-current", String(b.dataset.view === hl)));
  }

  /* ---------- התחברות והרשמה ---------- */
  function setMode(next) {
    mode = next;
    const s = mode === "signup";
    $("tabLogin").setAttribute("aria-selected", String(!s));
    $("tabSignup").setAttribute("aria-selected", String(s));
    $("nameRow").hidden = !s;
    $("authSubmit").textContent = s ? "יצירת חשבון" : "התחברות";
    $("password").autocomplete = s ? "new-password" : "current-password";
    $("authMsg").textContent = "";
  }
  $("tabLogin").onclick = () => setMode("login");
  $("tabSignup").onclick = () => setMode("signup");

  function hebrewError(err) {
    const m = ((err && err.message) || "").toLowerCase();
    if (m.includes("invalid login")) return "האימייל או הסיסמה שגויים.";
    if (m.includes("already registered")) return "כבר קיים חשבון עם האימייל הזה. אפשר להתחבר.";
    if (m.includes("email not confirmed")) return "צריך לאשר את האימייל. בדקי את תיבת הדואר שלך.";
    if (m.includes("password")) return "הסיסמה חייבת להכיל לפחות 6 תווים.";
    return "משהו השתבש. נסי שוב בעוד רגע.";
  }

  $("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("authSubmit");
    btn.disabled = true;
    say($("authMsg"), "");
    const email = $("email").value.trim(), password = $("password").value;
    try {
      if (mode === "signup") {
        const { data, error } = await db.auth.signUp({ email, password, options: { data: { full_name: $("fullName").value.trim() } } });
        if (error) throw error;
        if (!data.session) say($("authMsg"), "החשבון נוצר. שלחנו אליך מייל לאישור, ואחרי האישור אפשר להתחבר.", "ok");
      } else {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (err) { say($("authMsg"), hebrewError(err), "error"); }
    finally { btn.disabled = false; }
  });

  /* ---------- ספרייה ---------- */
  function itemCard(it) {
    const b = h("button", "item");
    b.type = "button";
    b.append(h("div", "kind", cats[it.category_id] || KINDS[it.kind] || ""), h("h3", null, it.title));
    b.append(h("div", "meta", (it.author ? "מאת " + it.author + ", " : "") + "נוסף " + dual(it.created_at)));
    if (it.summary) b.append(h("p", null, it.summary));
    b.onclick = () => openItem(it.id);
    return b;
  }

  async function loadMeta() {
    const [c, r] = await Promise.all([
      db.from("categories").select("id,name").order("created_at"),
      db.from("rebbes").select("id,name").order("ord").order("name")
    ]);
    catList = c.data || [];
    rebbeList = r.data || [];
    cats = Object.fromEntries(catList.map((x) => [x.id, x.name]));
    rebbeName = Object.fromEntries(rebbeList.map((x) => [x.id, x.name]));
  }

  function dparts(it) {
    if (!it.content_date) return { y: "ללא תאריך", m: "—", t: 0 };
    const d = new Date(it.content_date + "T12:00:00");
    const loc = cal === "heb" ? "he-u-ca-hebrew" : "he-IL-u-ca-gregory";
    const pp = new Intl.DateTimeFormat(loc, { year: "numeric", month: "long" }).formatToParts(d);
    const g = (t) => (pp.find((x) => x.type === t) || {}).value || "—";
    return { y: g("year"), m: g("month"), t: d.getTime() };
  }

  const STEPS = [
    { key: (it) => it.category_id || "none", name: (k) => (k === "none" ? "ללא קטגוריה" : cats[k] || "?"), order: () => catList.map((x) => x.id) },
    { key: (it) => it.rebbe_id || "none", name: (k) => (k === "none" ? "ללא רבי" : rebbeName[k] || "?"), order: () => rebbeList.map((x) => x.id) },
    { key: (it) => dparts(it).y, name: (k) => k },
    { key: (it) => dparts(it).m, name: (k) => k }
  ];

  function renderBrowse() {
    saveState({ path, showAll });
    const box = $("itemsList"), cr = $("crumbs");
    box.replaceChildren();
    cr.replaceChildren();
    const crumb = (label, fn) => { const b = h("button", "small", label); b.type = "button"; b.onclick = fn; cr.append(b); };
    crumb("ספרייה", () => { path = []; showAll = false; renderBrowse(); });
    let items = all;
    path.forEach((k, i) => {
      items = items.filter((it) => STEPS[i].key(it) === k);
      crumb(STEPS[i].name(k), () => { path = path.slice(0, i + 1); showAll = false; renderBrowse(); });
    });
    if (!items.length) { box.append(h("p", "muted", isAdmin ? "עדיין אין תכנים. אפשר להוסיף בעמוד הניהול." : "עדיין אין תכנים כאן.")); return; }
    if (path.length >= STEPS.length || showAll) { items.forEach((it) => box.append(itemCard(it))); return; }
    const step = STEPS[path.length], groups = new Map();
    items.forEach((it) => {
      const k = step.key(it), g = groups.get(k) || { k, n: 0, t: Infinity };
      g.n++;
      g.t = Math.min(g.t, dparts(it).t || Infinity);
      groups.set(k, g);
    });
    const ord = step.order ? step.order() : null;
    const list = [...groups.values()].sort((a, b) => ord ? (ord.indexOf(a.k) + 1 || 999) - (ord.indexOf(b.k) + 1 || 999) : (a.t === b.t ? 0 : a.t < b.t ? -1 : 1));
    const allBtn = h("button", "small", "הצגת כל התכנים כאן (" + items.length + ")");
    allBtn.type = "button";
    allBtn.style.marginBottom = "14px";
    allBtn.onclick = () => { showAll = true; renderBrowse(); };
    box.append(allBtn);
    list.forEach((g) => {
      const b = h("button", "item");
      b.type = "button";
      b.append(h("h3", null, step.name(g.k)), h("div", "meta", g.n + " תכנים"));
      b.onclick = () => { path.push(g.k); renderBrowse(); };
      box.append(b);
    });
  }

  async function loadLibrary() {
    $("itemsList").replaceChildren(h("p", "muted", "טוענים…"));
    await loadMeta();
    const { data, error } = await db.from("items").select("id,kind,title,author,summary,created_at,category_id,rebbe_id,content_date").order("created_at", { ascending: false });
    if (error) { $("itemsList").replaceChildren(h("p", "msg error", "לא הצלחנו לטעון את התכנים.")); return; }
    all = data;
    $("q").value = "";
    renderBrowse();
  }

  $("cal").onchange = (e) => { cal = e.target.value; saveState({ cal }); renderBrowse(); };

  /* ---------- ניהול תכנים ---------- */
  const yearCache = {};
  function scanYear(g) {
    if (yearCache[g]) return yearCache[g];
    const label = hp(new Date(g, 9, 31, 12)).y, days = [];
    for (let d = new Date(g, 8, 1, 12); d < new Date(g + 1, 9, 10, 12); d.setDate(d.getDate() + 1)) {
      const q = hp(d);
      if (q.y === label) days.push({ iso: isoOf(d), m: q.m, d: q.d });
    }
    return (yearCache[g] = { label, days });
  }
  function fillDays(g, selIso) {
    const days = scanYear(g).days.filter((x) => x.m === $("hM").value);
    $("hD").replaceChildren(...days.map((x) => new Option(x.d, x.iso)));
    if (selIso) $("hD").value = selIso;
  }
  function fillMonths(g, selM) {
    const ms = [...new Set(scanYear(g).days.map((x) => x.m))];
    $("hM").replaceChildren(...ms.map((m) => new Option(m, m)));
    if (selM && ms.includes(selM)) $("hM").value = selM;
    fillDays(g);
  }
  function initHeb() {
    const sy = $("hY");
    sy.replaceChildren(new Option("שנה", ""));
    for (let g = new Date().getFullYear() + 1; g >= 1745; g--) sy.append(new Option(hp(new Date(g, 9, 31, 12)).y, g));
  }
  $("hY").onchange = () => {
    const g = +$("hY").value;
    if (!g) { $("hM").replaceChildren(); $("hD").replaceChildren(); return; }
    fillMonths(g);
    $("iDate").value = $("hD").value;
  };
  $("hM").onchange = () => { fillDays(+$("hY").value); $("iDate").value = $("hD").value; };
  $("hD").onchange = () => { $("iDate").value = $("hD").value; };
  $("iDate").onchange = () => {
    const v = $("iDate").value;
    if (!v) return;
    const d = new Date(v + "T12:00:00");
    for (const g of [d.getFullYear(), d.getFullYear() - 1]) {
      if (scanYear(g).days.some((x) => x.iso === v)) { $("hY").value = g; fillMonths(g, hp(d).m); fillDays(g, v); return; }
    }
  };

      let image_path = null;
      if (pic) {
        image_path = me.id + "/" + crypto.randomUUID() + "." + ((pic.type.split("/")[1] || "png").replace(/[^a-z0-9]/gi, ""));
        const up = await db.storage.from("note-images").upload(image_path, pic, { contentType: pic.type || "image/png" });
        if (up.error) { add.disabled = false; hint.textContent = "העלאת התמונה נכשלה: " + up.error.message; return; }
      }
      const { error: err } = await db.from("notes").insert({ user_id: me.id, item_id: itemId, quote: quote.value.trim() || null, body: body.value.trim(), shared: cb.checked, image_path });
      add.disabled = false;
      if (err) { hint.textContent = "ההוספה נכשלה: " + err.message; return; }
      redraw();
    };
    box.append(form);
    data.filter((n) => n.user_id === me.id).forEach((n) => box.append(noteRow(n, null, true, redraw)));
    const others = data.filter((n) => n.user_id !== me.id);
    if (others.length) {
      const { data: ps } = await db.from("profiles").select("id,full_name").in("id", [...new Set(others.map((n) => n.user_id))]);
      const nm = Object.fromEntries((ps || []).map((x) => [x.id, x.full_name || "משתמש"]));
      box.append(h("h3", "sub", "הערות ששותפו איתי"));
      others.forEach((n) => box.append(noteRow(n, nm[n.user_id], false, redraw)));
    }
  }

  /* ---------- מועדפים והמשך מהמקום שעצרתי ---------- */
  function favButton(id) {
    const b = h("button", "fav");
    b.type = "button";
    const paint = () => {
      const on = favs.has(id);
      b.textContent = on ? "★ שמור במועדפים" : "☆ שמירה במועדפים";
      b.setAttribute("aria-pressed", String(on));
    };
    paint();
    b.onclick = async () => {
      b.disabled = true;
      if (favs.has(id)) {
        const { error } = await db.from("favorites").delete().eq("item_id", id).eq("user_id", me.id);
        if (!error) favs.delete(id);
      } else {
        const { error } = await db.from("favorites").insert({ user_id: me.id, item_id: id });
        if (!error) favs.add(id);
      }
      b.disabled = false;
      paint();
    };
    return b;
  }

  function fillList(box, res, emptyText) {
    box.replaceChildren();
    if (res.error) { box.append(h("p", "msg error", "לא הצלחנו לטעון את הרשימה.")); return; }
    const rows = (res.data || []).map((r) => r.items).filter(Boolean);
    if (!rows.length) { box.append(h("p", "muted", emptyText)); return; }
    rows.forEach((it) => box.append(itemCard(it)));
  }

  function renderMyFavs(box, res) {
    box.replaceChildren();
    if (res.error) { box.append(h("p", "msg error", "לא הצלחנו לטעון את הרשימה.")); return; }
    const rows = (res.data || []).filter((r) => r.items);
    if (!rows.length) { box.append(h("p", "muted", "אין עדיין מועדפים. בעמוד של כל תוכן יש כפתור לשמירה.")); return; }
    rows.forEach((r) => {
      const wrap = h("div", "favrow");
      wrap.append(itemCard(r.items));
      const lab = h("label", "check");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!r.shared;
      cb.onchange = async () => {
        const { error } = await db.from("favorites").update({ shared: cb.checked }).eq("user_id", me.id).eq("item_id", r.items.id);
        if (error) { cb.checked = !cb.checked; say($("favMsg"), "העדכון נכשל. נסו שוב.", "error"); return; }
        say($("favMsg"), cb.checked ? "התוכן סומן לשיתוף." : "התוכן כבר לא משותף.", "ok");
      };
      lab.append(cb, document.createTextNode(" לשתף את התוכן הזה"));
      wrap.append(lab);
      box.append(wrap);
    });
  }

  async function loadAccountLists() {
    const cols = "items(id,kind,title,author,summary,created_at)";
    const [rec, fav] = await Promise.all([
      db.from("history").select("opened_at," + cols).eq("user_id", me.id).order("opened_at", { ascending: false }).limit(5),
      db.from("favorites").select("created_at,shared," + cols).eq("user_id", me.id).order("created_at", { ascending: false })
    ]);
    fillList($("recentList"), rec, "עדיין לא נפתחו תכנים. תכנים שתפתחו יופיעו כאן.");
    renderMyFavs($("favList"), fav);
  }

  /* ---------- שיתוף המועדפים ---------- */
  function personRow(p, label, onClick) {
    const row = h("div", "row");
    const info = h("div");
    info.append(h("div", null, p.full_name || "משתמש ללא שם"));
    if (p.bio) info.append(h("div", "meta", p.bio.slice(0, 60)));
    const b = h("button", "small", label);
    b.type = "button";
    b.onclick = onClick;
    row.append(info, b);
    return row;
  }

  $("pubToggle").onchange = async (e) => {
    const on = e.target.checked;
    const { error } = await db.from("profiles").update({ favs_public: on }).eq("id", me.id);
    if (error) { e.target.checked = !on; say($("shareMsg"), "העדכון נכשל. נסו שוב.", "error"); return; }
    say($("shareMsg"), on ? "התכנים שסימנת לשיתוף גלויים עכשיו לכל המשתמשים באתר." : "התכנים שלך כבר לא גלויים לכולם.", "ok");
  };

  $("userSearchForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("userQ").value.trim().replace(/[%_*,()]/g, "");
    const box = $("userResults");
    box.replaceChildren();
    if (q.length < 2) { box.append(h("p", "muted", "כדאי להקליד לפחות שני תווים מהשם.")); return; }
    const { data, error } = await db.from("profiles").select("id,full_name,bio").ilike("full_name", "%" + q + "%").neq("id", me.id).limit(10);
    if (error) { box.append(h("p", "msg error", "החיפוש נכשל.")); return; }
    if (!data.length) { box.append(h("p", "muted", "לא נמצאו משתמשים בשם הזה.")); return; }
    data.forEach((u) => box.append(personRow(u, "שיתוף", () => addShare(u.id))));
  });

  async function addShare(viewerId) {
    const { error } = await db.from("favorite_shares").upsert({ owner_id: me.id, viewer_id: viewerId }, { onConflict: "owner_id,viewer_id", ignoreDuplicates: true });
    if (error) { say($("shareMsg"), "השיתוף נכשל.", "error"); return; }
    say($("shareMsg"), "המועדפים שלך שותפו.", "ok");
    $("userResults").replaceChildren();
    $("userQ").value = "";
    loadSharedWith();
  }

  async function removeShare(viewerId) {
    const { error } = await db.from("favorite_shares").delete().eq("owner_id", me.id).eq("viewer_id", viewerId);
    if (error) { say($("shareMsg"), "ביטול השיתוף נכשל.", "error"); return; }
    say($("shareMsg"), "השיתוף בוטל.", "ok");
    loadSharedWith();
  }

  async function loadSharedWith() {
    const box = $("sharedWith");
    box.replaceChildren();
    const { data, error } = await db.from("favorite_shares").select("viewer_id").eq("owner_id", me.id);
    if (error) { box.append(h("p", "msg error", "לא הצלחנו לטעון את הרשימה.")); return; }
    if (!data.length) { box.append(h("p", "muted", "עדיין לא שותף עם משתמשים מסוימים.")); return; }
    const { data: ps } = await db.from("profiles").select("id,full_name,bio").in("id", data.map((r) => r.viewer_id));
    (ps || []).forEach((u) => box.append(personRow(u, "ביטול שיתוף", () => removeShare(u.id))));
  }

  async function loadSharedToMe() {
    const box = $("sharedToMe");
    box.replaceChildren();
    const [direct, pub] = await Promise.all([
      db.from("favorite_shares").select("owner_id").eq("viewer_id", me.id),
      db.from("profiles").select("id,full_name,bio").eq("favs_public", true).neq("id", me.id).limit(50)
    ]);
    if (direct.error || pub.error) { box.append(h("p", "msg error", "לא הצלחנו לטעון את הרשימה.")); return; }
    const people = pub.data.slice();
    const ids = direct.data.map((r) => r.owner_id);
    if (ids.length) {
      const { data } = await db.from("profiles").select("id,full_name,bio").in("id", ids);
      (data || []).forEach((u) => { if (!people.some((x) => x.id === u.id)) people.push(u); });
    }
    if (!people.length) { box.append(h("p", "muted", "עדיין אף אחד לא שיתף איתך רשימה.")); return; }
    people.forEach((u) => box.append(personRow(u, "צפייה ברשימה", () => openShared(u))));
  }

  async function openShared(u) {
    show("sharedView");
    saveState({ sharedUser: { id: u.id, full_name: u.full_name } });
    $("sharedTitle").textContent = "המועדפים של " + (u.full_name || "משתמש");
    const box = $("sharedItems");
    box.replaceChildren(h("p", "muted", "טוענים…"));
    const res = await db.from("favorites").select("created_at,items(id,kind,title,author,summary,created_at)").eq("user_id", u.id).order("created_at", { ascending: false });
    fillList(box, res, "אין תכנים משותפים כרגע.");
  }
  $("backAcc").onclick = () => show("accountView");

  /* ---------- ניווט ומצב התחברות ---------- */
  $("navLib").onclick = () => { path = []; showAll = false; show("libraryView"); loadLibrary(); };
  $("navAcc").onclick = () => { say($("profileMsg"), ""); show("accountView"); loadAccountLists(); loadSharedWith(); loadSharedToMe(); };
  $("navAdmin").onclick = () => { show("adminView"); loadAdmin(); loadUsers(); loadSharedNotes(); };
  $("logoutBtn").onclick = () => db.auth.signOut();

  async function enterApp(user) {
    if (me && me.id === user.id) return;
    me = user;
    const { data } = await db.from("profiles").select("full_name,bio,is_admin,favs_public,blocked").eq("id", user.id).maybeSingle();
    if (data && data.blocked) { me = null; flashMsg = "החשבון הזה נחסם. לפרטים אפשר לפנות למנהלת האתר."; await db.auth.signOut(); return; }
    isAdmin = !!(data && data.is_admin);
    const { data: fv } = await db.from("favorites").select("item_id").eq("user_id", user.id);
    favs = new Set((fv || []).map((r) => r.item_id));
    $("pName").value = (data && data.full_name) || "";
    $("pBio").value = (data && data.bio) || "";
    $("accountEmail").textContent = user.email;
    $("pubToggle").checked = !!(data && data.favs_public);
    setHello($("pName").value);
    $("navAdmin").hidden = !isAdmin;
    $("nav").hidden = false;
    const st = loadState();
    if (st.cal) { cal = st.cal; $("cal").value = cal; }
    if (Array.isArray(st.path)) { path = st.path; showAll = !!st.showAll; }
    await loadLibrary();
    if (st.view === "itemView" && st.itemId) await openItem(st.itemId);
    else if (st.view === "accountView") { show("accountView"); loadAccountLists(); loadSharedWith(); loadSharedToMe(); }
    else if (st.view === "adminView" && isAdmin) { show("adminView"); loadAdmin(); }
    else if (st.view === "sharedView" && st.sharedUser) await openShared(st.sharedUser);
    else show("libraryView");
    if (st.scroll) { const go = () => window.scrollTo(0, st.scroll); setTimeout(go, 150); setTimeout(go, 800); }
  }

  function leaveApp() {
    me = null; isAdmin = false; favs = new Set();
    try { sessionStorage.removeItem(SS); } catch (e) {}
    $("nav").hidden = true;
    $("authForm").reset();
    setMode("login");
    show("authView");
    if (flashMsg) { say($("authMsg"), flashMsg, "error"); flashMsg = ""; }
  }

  db.auth.onAuthStateChange((_event, session) => {
    setTimeout(() => {
      if (session && session.user) enterApp(session.user); else leaveApp();
    }, 0);
  });
</script>
</body>
</html>
